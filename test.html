<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alert Example</title>
  <script>
    // This runs when the page loads
    window.onload = function() {
      alert("Hello! This is an alert triggered on page load.");
    };
  </script>
</head>
<body>
  <h1>Welcome to the Alert Example Page</h1>
  <p>This page will show an alert when it loads.</p>
</body>
</html>
